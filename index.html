<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PenaltyMind</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

```
<h1>⚽ PenaltyMind</h1>

<p id="message">Choisis une direction</p>

<div class="scoreboard">
  <span>Tir : <b id="shotNumber">1</b>/10</span>
  <span>Score : <b id="score">0</b></span>
  <span>Combo : <b id="combo">0</b></span>
</div>

<div class="goal">
  <div id="keeper">🧤</div>
  <div id="ball">⚽</div>
</div>

<div id="controls">
  <button class="shot-btn" data-direction="left">⬅️ Gauche</button>
  <button class="shot-btn" data-direction="center">⬆️ Centre</button>
  <button class="shot-btn" data-direction="right">➡️ Droite</button>
</div>

<div id="result" class="hidden">
  <h2 id="resultTitle">🏁 Fin de partie</h2>
  <p>Score : <b id="finalScore">0</b></p>
  <p>Record : <b id="bestScore">0</b></p>
  <button id="restartBtn">🔄 Rejouer</button>
</div>
```

  </main>

  <script src="game.js"></script>

</body>
</html>
