<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PenaltyMind</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #101828;
    color: white;
}

body {
    min-height: 100vh;
}

.screen {
    min-height: 100vh;
    width: 100%;
}

.hidden {
    display: none !important;
}

/* MENU */

#menu {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#162b4a, #07101d);
}

.menu {
    width: 90%;
    max-width: 450px;
    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 5px;
}

.logo span {
    color: #00d9ff;
}

.subtitle {
    color: #9db0c5;
    margin-bottom: 35px;
}

button {
    width: 100%;
    padding: 16px;
    margin: 7px 0;
    border: 0;
    border-radius: 12px;
    background: #17304d;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.2);
}

.play {
    background: #00aeea;
}

/* JEU */

#game {
    background: #071522;
}

.header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px;
    background: #102236;
}

.small {
    width: auto;
    padding: 9px 13px;
    margin: 0;
    font-size: 13px;
}

.score {
    display: flex;
    justify-content: center;
    gap: 50px;
    padding: 15px;
    text-align: center;
}

.score div {
    display: flex;
    flex-direction: column;
}

.score span {
    color: #7f96ad;
    font-size: 11px;
}

.score strong {
    font-size: 22px;
}

/* STADE */

.stadium {
    position: relative;
    height: 430px;
    overflow: hidden;
    background: linear-gradient(
        #65c8f5 0%,
        #a7e4ff 45%,
        #278947 45%,
        #17662e 100%
    );
}

.goal {
    position: absolute;
    width: 75%;
    height: 48%;
    left: 12.5%;
    top: 14%;
    border: 7px solid white;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0 18px,
            rgba(255,255,255,.2) 18px 20px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0 18px,
            rgba(255,255,255,.2) 18px 20px
        );
}

.keeper {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 60px;
    transition: left .35s;
}

.ball {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 42px;
    transition: all .5s;
}

.target {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #00e5ff;
    border: 3px solid white;
    box-shadow: 0 0 15px #00e5ff;
    transform: translate(-50%, -50%);
}

.message {
    text-align: center;
    min-height: 45px;
    padding: 12px;
    font-weight: bold;
}

/* PUISSANCE */

.power {
    padding: 15px;
    background: #0a1725;
    text-align: center;
}

.meter {
    height: 25px;
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}

.zone {
    flex: 1;
}

.red {
    background: #d63d3d;
}

.yellow {
    background: #e4bd3e;
}

.green {
    background: #32c968;
}

.needle {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 4px;
    background: white;
    left: 0;
}

.shoot {
    background: #00aeea;
}

/* RESULTAT */

.result {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.result-box {
    width: 90%;
    max-width: 400px;
    background: #12263d;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
}

.result-box h2 {
    font-size: 32px;
}

/* MOBILE */

@media (max-width: 600px) {
    .logo {
        font-size: 34px;
    }

    .stadium {
        height: 350px;
    }

    .score {
        gap: 30px;
    }
}
</style>
</head>

<body>

<!-- MENU -->

<section id="menu" class="screen">

    <div class="menu">

        <div class="logo">
            PENALTY<span>MIND</span>
        </div>

        <div class="subtitle">
            DEVINE. TIRE. MARQUE.
        </div>

        <button id="play" class="play">
            ⚽ JOUER
        </button>

        <button id="training">
            🎯 ENTRAÎNEMENT
        </button>

        <button id="daily">
            🏆 QUÊTES
        </button>

        <button id="stats">
            📊 STATISTIQUES
        </button>

    </div>

</section>


<!-- JEU -->

<section id="game" class="screen hidden">

    <div class="header">

        <button id="back" class="small">
            ← MENU
        </button>

        <strong>PENALTYMIND</strong>

        <span>⚽</span>

    </div>

    <div class="score">

        <div>
            <span>TIR</span>
            <strong id="shot">1</strong>
        </div>

        <div>
            <span>SCORE</span>
            <strong id="points">0</strong>
        </div>

        <div>
            <span>COMBO</span>
            <strong id="combo">0</strong>
        </div>

    </div>

    <div class="stadium">

        <div class="goal">

            <div id="target" class="target"></div>

            <div id="keeper" class="keeper">
                🧤
            </div>

        </div>

        <div id="ball" class="ball">
            ⚽
        </div>

    </div>

    <div id="message" class="message">
        Choisis ta puissance !
    </div>

    <div class="power">

        <div class="meter">

            <div class="zone red"></div>
            <div class="zone yellow"></div>
            <div class="zone green"></div>
            <div class="zone yellow"></div>
            <div class="zone red"></div>

            <div id="needle" class="needle"></div>

        </div>

        <button id="shoot" class="shoot">
            ⚡ TIRER !
        </button>

    </div>

</section>


<!-- RESULTAT -->

<div id="result" class="result hidden">

    <div class="result-box">

        <h2 id="resultTitle">
            FIN DU MATCH
        </h2>

        <p>
            Score :
            <strong id="finalScore">0</strong>
        </p>

        <button id="again" class="play">
            🔄 REJOUER
        </button>

        <button id="resultMenu">
            🏠 MENU
        </button>

    </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function() {

    const menu = document.getElementById("menu");
    const game = document.getElementById("game");

    const play = document.getElementById("play");
    const back = document.getElementById("back");
    const shoot = document.getElementById("shoot");

    const result = document.getElementById("result");
    const again = document.getElementById("again");
    const resultMenu = document.getElementById("resultMenu");

    const keeper = document.getElementById("keeper");
    const target = document.getElementById("target");
    const ball = document.getElementById("ball");

    const shotText = document.getElementById("shot");
    const pointsText = document.getElementById("points");
    const comboText = document.getElementById("combo");
    const message = document.getElementById("message");
    const finalScore = document.getElementById("finalScore");
    const resultTitle = document.getElementById("resultTitle");

    const needle = document.getElementById("needle");

    let shot = 1;
    let score = 0;
    let combo = 0;

    let targetSide = "center";
    let keeperSide = "center";

    let power = 0;
    let direction = 1;

    let timer = null;
    let waiting = false;


    function showMenu() {

        menu.classList.remove("hidden");
        game.classList.add("hidden");
        result.classList.add("hidden");

        stopMeter();
    }


    function showGame() {

        menu.classList.add("hidden");
        game.classList.remove("hidden");
        result.classList.add("hidden");
    }


    function sidePosition(side) {

        if (side === "left") return "25%";
        if (side === "right") return "75%";

        return "50%";
    }


    function randomSide() {

        const sides = ["left", "center", "right"];

        return sides[
            Math.floor(Math.random() * sides.length)
        ];
    }


    function newShot() {

        waiting = false;

        targetSide = randomSide();
        keeperSide = randomSide();

        target.style.left =
            sidePosition(targetSide);

        target.style.top =
            ["30%", "45%", "60%"][
                Math.floor(Math.random() * 3)
            ];

        keeper.style.left =
            sidePosition(keeperSide);

        ball.style.left = "50%";
        ball.style.bottom = "20px";

        shotText.textContent = shot;

        message.textContent =
            "🎯 Vise la cible et tire !";
    }


    function startMeter() {

        stopMeter();

        power = 0;
        direction = 1;

        timer = setInterval(function() {

            power += direction * 2;

            if (power >= 100) {
                power = 100;
                direction = -1;
            }

            if (power <= 0) {
                power = 0;
                direction = 1;
            }

            needle.style.left = power + "%";

        }, 25);
    }


    function stopMeter() {

        if (timer) {
            clearInterval(timer);
            timer = null;
        }
    }


    function startGame() {

        shot = 1;
        score = 0;
        combo = 0;

        pointsText.textContent = "0";
        comboText.textContent = "0";

        showGame();

        newShot();
        startMeter();
    }


    function shootBall() {

        if (waiting) return;

        waiting = true;

        stopMeter();

        ball.style.left =
            sidePosition(targetSide);

        ball.style.bottom = "50%";

        setTimeout(function() {

            const saved =
                targetSide === keeperSide;

            if (saved) {

                combo = 0;

                comboText.textContent = "0";

                message.textContent =
                    "🧤 ARRÊT DU GARDIEN !";

                resultTitle.textContent =
                    "🧤 ARRÊT !";

            } else {

                const bonus =
                    power >= 35 && power <= 70
                    ? 5
                    : 0;

                const gained =
                    10 + combo * 2 + bonus;

                score += gained;
                combo++;

                pointsText.textContent = score;
                comboText.textContent = combo;

                message.textContent =
                    "⚽ BUT ! +" + gained;

                resultTitle.textContent =
                    "⚽ BUT !";
            }


            setTimeout(function() {

                shot++;

                if (shot > 5) {

                    finalScore.textContent = score;

                    result.classList.remove("hidden");

                } else {

                    newShot();
                    startMeter();

                }

            }, 800);

        }, 500);
    }


    play.addEventListener("click", startGame);

    again.addEventListener("click", startGame);

    shoot.addEventListener("click", shootBall);

    back.addEventListener("click", showMenu);

    resultMenu.addEventListener("click", showMenu);


    document.addEventListener("keydown", function(event) {

        if (
            event.code === "Space" &&
            !game.classList.contains("hidden")
        ) {
            shootBall();
        }

    });


    // Démarrage
    showMenu();

});
</script>

</body>
</html>
