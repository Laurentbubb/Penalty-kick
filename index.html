```html
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PenaltyMind</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <!-- =========================
         BARRE DU HAUT
    ========================== -->

    <header class="topbar">

      <div>
        <h1>⚽ PenaltyMind</h1>

        <p class="subtitle">
          Clique dans la cage pour tirer
        </p>
      </div>

      <div class="stats">

        <div>
          <span>Tir</span>
          <strong id="shotNumber">1</strong>
        </div>

        <div>
          <span>Score</span>
          <strong id="score">0</strong>
        </div>

        <div>
          <span>Combo</span>
          <strong id="combo">0</strong>
        </div>

      </div>

    </header>


    <!-- =========================
         TERRAIN
    ========================== -->

    <section class="match">

      <div class="stadium">

        <div class="sky"></div>

        <div class="crowd"></div>

        <div class="field">

          <div class="penalty-area"></div>

          <div class="penalty-spot"></div>

        </div>


        <!-- =========================
             CAGE
        ========================== -->

        <div id="goal" class="goal">

          <div class="net"></div>

          <div class="post post-left"></div>

          <div class="post post-right"></div>

          <div class="crossbar"></div>


          <!-- Gardien -->

          <div id="keeper" class="keeper">

            <div class="keeper-head"></div>

            <div class="keeper-body"></div>

            <div class="keeper-arm left"></div>

            <div class="keeper-arm right"></div>

            <div class="keeper-leg left"></div>

            <div class="keeper-leg right"></div>

          </div>


          <!-- Cible -->

          <div
            id="targetDot"
            class="target-dot">
          </div>


          <!-- BALLE -->

          <div
            id="ball"
            class="ball">
            ⚽
          </div>

        </div>


        <!-- Joueur -->

        <div class="player">

          <div class="player-head"></div>

          <div class="player-body"></div>

          <div class="player-arm left"></div>

          <div class="player-arm right"></div>

          <div class="player-leg left"></div>

          <div class="player-leg right"></div>

        </div>


        <!-- Message -->

        <div
          id="message"
          class="message">
          Clique dans la cage pour tirer ⚽
        </div>

      </div>


      <!-- =========================
           CONTROLES
      ========================== -->

      <div class="controls">

        <div class="instructions">

          <span>🎯 Clique dans la cage</span>

          <span>⚽ Le tir part automatiquement</span>

          <span>🧤 Évite le gardien</span>

        </div>


        <!-- Jauge -->

        <div class="power-panel">

          <div class="power-labels">

            <span>FAIBLE</span>

            <span>PARFAIT</span>

            <span>FORT</span>

          </div>


          <div class="power-bar">

            <div class="power-zone red left-red"></div>

            <div class="power-zone orange left-orange"></div>

            <div class="power-zone green"></div>

            <div class="power-zone orange right-orange"></div>

            <div class="power-zone red right-red"></div>

            <div
              id="needle"
              class="needle">
            </div>

          </div>

        </div>


        <!-- Résultat -->

        <div
          id="result"
          class="result hidden">

          <h2 id="resultTitle">
            🏁 Fin du match
          </h2>

          <p>
            Score :
            <strong id="finalScore">0</strong>
          </p>

          <p>
            Meilleur score :
            <strong id="bestScore">0</strong>
          </p>

          <button
            id="restartButton"
            class="restart-button">
            Rejouer
          </button>

        </div>

      </div>

    </section>

  </main>


  <script src="game.js"></script>

</body>

</html>
