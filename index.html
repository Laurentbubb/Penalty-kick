<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PenaltyMind</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

```
<header class="topbar">

  <div>
    <h1>PenaltyMind</h1>

    <p class="subtitle">
      Vise juste. Trouve le bon timing. Bat le gardien.
    </p>
  </div>

  <div class="stats">

    <div>
      <span>Penalty</span>
      <strong>
        <span id="shotNumber">1</span>/10
      </strong>
    </div>

    <div>
      <span>Score</span>
      <strong id="score">0</strong>
    </div>

    <div>
      <span>Combo</span>
      <strong id="combo">0</strong>
    </div>

  </div>

</header>


<section class="match">

  <div class="stadium">

    <!-- CIEL -->

    <div class="sky"></div>

    <!-- PUBLIC -->

    <div class="crowd"></div>


    <!-- TERRAIN -->

    <div class="field">

      <div class="penalty-area"></div>

      <div class="penalty-spot"></div>


      <!-- JOUEUR -->

      <div class="player">

        <div class="player-head"></div>

        <div class="player-body"></div>

        <div class="player-arm left"></div>

        <div class="player-arm right"></div>

        <div class="player-leg left"></div>

        <div class="player-leg right"></div>

      </div>


      <!-- BALLON -->

      <div
        class="ball"
        id="ball"
      >
        ⚽
      </div>

    </div>


    <!-- CAGE -->

    <div
      class="goal"
      id="goal"
    >

      <!-- FILET -->

      <div class="net"></div>


      <!-- POTEAUX -->

      <div class="post post-left"></div>

      <div class="post post-right"></div>


      <!-- BARRE -->

      <div class="crossbar"></div>


      <!-- GARDIEN -->

      <div
        class="keeper"
        id="keeper"
      >

        <div class="keeper-head"></div>

        <div class="keeper-body"></div>

        <div class="keeper-arm left"></div>

        <div class="keeper-arm right"></div>

        <div class="keeper-leg left"></div>

        <div class="keeper-leg right"></div>

      </div>


      <!-- CIBLE -->

      <div
        class="target-dot"
        id="targetDot"
      ></div>

    </div>


    <!-- MESSAGE -->

    <div
      class="message"
      id="message"
    >
      Clique dans la cage pour viser
    </div>

  </div>


  <!-- CONTROLES -->

  <div class="controls">

    <div class="instructions">

      <span>
        🖱️ Clique dans la cage pour viser
      </span>

      <span>
        🎯 Tire quand la jauge est verte
      </span>

    </div>


    <!-- JAUGE -->

    <div class="power-panel">

      <div class="power-labels">

        <span>IMPRÉCIS</span>

        <strong>PRÉCISION</strong>

        <span>IMPRÉCIS</span>

      </div>


      <div class="power-bar">

        <div class="power-zone red left-red"></div>

        <div class="power-zone orange left-orange"></div>

        <div class="power-zone green"></div>

        <div class="power-zone orange right-orange"></div>

        <div class="power-zone red right-red"></div>

        <div
          class="needle"
          id="needle"
        ></div>

      </div>


      <button
        id="shootButton"
        class="shoot-button"
      >
        TIRER !
      </button>

    </div>


    <!-- RESULTAT -->

    <div
      class="result hidden"
      id="result"
    >

      <h2 id="resultTitle">
        Fin du match
      </h2>

      <p>
        Score final :
        <strong id="finalScore">0</strong>
      </p>

      <p>
        Meilleur score :
        <strong id="bestScore">0</strong>
      </p>

      <button
        id="restartButton"
        class="restart-button"
      >
        Rejouer
      </button>

    </div>

  </div>

</section>
```

  </main>

  <!-- JAVASCRIPT -->

  <script src="game.js"></script>

</body>

</html>
