<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>PenaltyMind</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <header class="topbar">

      <div>
        <h1>⚽ PenaltyMind</h1>
        <p class="subtitle">Vise la cage et trompe le gardien</p>
      </div>

      <div class="stats">
        <div>
          <span>Tir</span>
          <strong id="shotNumber">1</strong>
        </div>

        <div>
          <span>Score</span>
          <strong id="score">0</strong>
        </div>

        <div>
          <span>Combo</span>
          <strong id="combo">0</strong>
        </div>
      </div>

    </header>


    <section class="match">

      <div class="stadium">

        <div class="sky"></div>
        <div class="crowd"></div>

        <div class="field">
          <div class="penalty-area"></div>
          <div class="penalty-spot"></div>
        </div>


        <!-- CAGE -->

        <div id="goal" class="goal">

          <div class="net"></div>

          <div class="post post-left"></div>
          <div class="post post-right"></div>
          <div class="crossbar"></div>


          <!-- GARDIEN -->

          <div id="keeper" class="keeper">

            <div class="keeper-head"></div>
            <div class="keeper-body"></div>

            <div class="keeper-arm left"></div>
            <div class="keeper-arm right"></div>

            <div class="keeper-leg left"></div>
            <div class="keeper-leg right"></div>

          </div>


          <!-- CIBLE -->

          <div id="targetDot" class="target-dot"></div>


          <!-- BALLON -->

          <div id="ball" class="ball">⚽</div>

        </div>


        <!-- JOUEUR -->

        <div class="player">

          <div class="player-head"></div>
          <div class="player-body"></div>

          <div class="player-arm left"></div>
          <div class="player-arm right"></div>

          <div class="player-leg left"></div>
          <div class="player-leg right"></div>

        </div>


        <!-- MESSAGE -->

        <div id="message" class="message">
          Tape dans la cage pour tirer ⚽
        </div>

      </div>


      <!-- CONTROLES -->

      <div class="controls">

        <div class="instructions">

          <span>🎯 Vise la cage</span>
          <span>⚽ Le tir part automatiquement</span>
          <span>🧤 Évite le gardien</span>

        </div>


        <!-- PUISSANCE -->

        <div class="power-panel">

          <div class="power-labels">
            <span>FAIBLE</span>
            <span>PARFAIT</span>
            <span>FORT</span>
          </div>

          <div class="power-bar">

            <div class="power-zone red left-red"></div>
            <div class="power-zone orange left-orange"></div>
            <div class="power-zone green"></div>
            <div class="power-zone orange right-orange"></div>
            <div class="power-zone red right-red"></div>

            <div id="needle" class="needle"></div>

          </div>

        </div>


        <!-- SON -->

        <button
          id="soundButton"
          class="sound-button"
          type="button"
          aria-pressed="true"
        >
          🔊 Son
        </button>


        <!-- FIN DE MATCH -->

        <div id="result" class="result hidden">

          <h2 id="resultTitle">🏁 Match terminé</h2>

          <p>
            Score :
            <strong id="finalScore">0</strong>
          </p>

          <p>
            Meilleur score :
            <strong id="bestScore">0</strong>
          </p>

          <button id="restartButton" class="restart-button" type="button">
            Rejouer
          </button>

        </div>

      </div>

    </section>

  </main>

  <script src="game.js"></script>

</body>
</html>
